[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "py-total-serialism"
version = "1.2.0"
description = "An app that generates Total Serial sheet music"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Ryan Butler", email = "rmbutler@outlook.com" }
]
classifiers = [
    "License :: OSI Approved :: BSD License",
]
dependencies = ["PyQt6 >=6.11.0"]

[project.scripts]
total-serialism = "gui.cli:main"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"
wheel.packages = ["python_bindings/py_total_serialism", "gui"]
cmake.args = [
    "-DWITH_PYTHON_BINDINGS='ON'"
]

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1


# Don't test Python 3.8 wheels on macOS/arm64
test-skip="cp38-macosx_*:arm64"

# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"
